name: aos-crm-local

# AOS-CRM local profile (CRM-002). Builds the pinned twenty/v2.51.0 source
# (15e4826d3b5fc5867baeabeeb42b253892b2d4da) via the official
# packages/twenty-docker/twenty/Dockerfile; never pulls twentycrm/twenty.
# Run through scripts/aos/local.ps1, not directly: it generates
# deploy/local/.env and validates deploy/local/privacy.env (CRM-003) before
# any build/up. See docs/aos/bootstrap/LOCAL_SECURITY.md for the contract
# and docs/aos/bootstrap/SECURITY_AUDIT.md (SEC-01..SEC-03) for why each
# control below exists.

x-aos-crm-app: &aos-crm-app
  build:
    context: ../..
    dockerfile: packages/twenty-docker/twenty/Dockerfile
    target: twenty
    args:
      # Must parse as semver: the server validates APP_VERSION with
      # semver.parse() at boot (IsTwentySemVer) and a value it rejects makes
      # every start crash-loop with "Config variables validation failed",
      # which the healthcheck only reports as "unhealthy". The upstream tag
      # lives in the labels below, not here.
      APP_VERSION: ${AOS_CRM_APP_VERSION:-2.51.0+15e4826d3b}
    # Make the artifact self-describing: the image carries the upstream commit
    # it was built from AND the AOS commit/tree that actually produced these
    # bytes, so `docker inspect` answers "which source is this?" without
    # trusting the mutable tag it happens to be named with. The upstream
    # revision alone is not an answer: every AOS commit on top of the pin
    # builds a different image while naming the same upstream SHA.
    # local.ps1 refreshes the three ai.aos.crm.source.* values in
    # deploy/local/.env immediately before building, and
    # scripts/aos/verify-image-provenance.mjs rejects an image whose labels do
    # not match this checkout (including the literal 'unset' default below).
    labels:
      org.opencontainers.image.revision: "15e4826d3b5fc5867baeabeeb42b253892b2d4da"
      org.opencontainers.image.version: "twenty-v2.51.0"
      ai.aos.crm.source.commit: "${AOS_CRM_SOURCE_COMMIT:-unset}"
      ai.aos.crm.source.tree: "${AOS_CRM_SOURCE_TREE:-unset}"
      ai.aos.crm.source.dirty: "${AOS_CRM_SOURCE_DIRTY:-unset}"
  image: ${AOS_CRM_IMAGE_TAG:?set AOS_CRM_IMAGE_TAG in deploy/local/.env to a local, non-moving tag such as aos-crm-local/twenty:v2.51.0-15e4826d3b}
  pull_policy: never
  # deploy/local/privacy.env is the CRM-003 contract (telemetry/analytics/
  # cron-sync/config-in-db opt-outs); env_file errors out if the file is
  # missing, so a start attempt without it fails closed before any service
  # runs (see R2.1). It is never created by this track.
  env_file:
    - ./privacy.env
  networks:
    - aos-crm-local
  volumes:
    - aos-crm-local-storage:/app/packages/twenty-server/.local-storage
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-aos-crm-env: &aos-crm-env
  PG_DATABASE_URL: postgres://${AOS_CRM_PG_USER:-aos_crm}:${AOS_CRM_PG_PASSWORD:?set AOS_CRM_PG_PASSWORD in deploy/local/.env}@db:5432/${AOS_CRM_PG_DB:-aos_crm_local}
  REDIS_URL: redis://redis:6379
  # `localhost`, not `127.0.0.1`: with multi-workspace on (below) every
  # workspace lives at its OWN subdomain of this hostname, and the workspace a
  # request belongs to is resolved from that subdomain
  # (domain/domain-server-config/utils/get-subdomain-and-custom-domain-from-hostname.util.ts,
  # domain/workspace-domains/services/workspace-domains.service.ts
  # resolveWorkspaceAndPublicDomain). An IP literal cannot carry one that a
  # browser will resolve, so the base host has to be a name whose subdomains
  # reach loopback -- `*.localhost` does, by RFC 6761, without DNS or a hosts
  # entry. The published port stays bound to 127.0.0.1 (see server.ports).
  # scripts/aos/local.ps1 blocks a start whose effective SERVER_URL is not
  # http://localhost:<AOS_CRM_WEB_PORT> for exactly this reason.
  SERVER_URL: ${AOS_CRM_SERVER_URL:-http://localhost:43000}
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${AOS_CRM_ENCRYPTION_KEY:?set AOS_CRM_ENCRYPTION_KEY in deploy/local/.env}
  # Forced regardless of privacy.env content: SEC-01 (SECURITY_AUDIT.md).
  # NODE_ENV=production in the image already defaults both to DISABLED, but
  # a local profile must not depend on an implicit default surviving an
  # upstream Dockerfile change.
  LOGIC_FUNCTION_TYPE: DISABLED
  CODE_INTERPRETER_TYPE: DISABLED
  # BETA PROFILE (CRM-014), the same shape the AWS beta runs (CRM-013): one
  # isolated workspace per person, each at its own subdomain of SERVER_URL, and
  # workspaces opened by the operator only.
  #
  # IS_MULTIWORKSPACE_ENABLED (config-variables.ts:2184, default false) is what
  # makes a second workspace possible at all and what makes the workspace be
  # resolved per request from the subdomain instead of "the only one there is"
  # (workspace-domains.service.ts getDefaultWorkspace throws when it is on).
  IS_MULTIWORKSPACE_ENABLED: "true"
  # ...and this is what keeps that from being open registration
  # (config-variables.ts:588, default true -- pinned here so the profile states
  # it instead of inheriting it). sign-in-up.service.ts enforces it twice:
  # assertWorkspaceCreationAllowed refuses signUpInNewWorkspace to anyone whose
  # user row does not carry canAccessFullAdminPanel (user.entity.ts:77), and
  # assertSignUpWithoutWorkspaceAllowed refuses a bare signUp that has no
  # pending invitation. Only the FIRST user of the server is granted that flag
  # (sign-in-up.service.ts:842-850, hasServerAdmin), so on this deployment the
  # operator is that first user and every friend invited afterwards is not.
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
  # The subdomain of the bare-domain landing host. It is deliberately NOT any
  # workspace's subdomain: get-subdomain-and-custom-domain-from-hostname.util.ts
  # maps it back to "no workspace", which is what makes
  # http://app.localhost:<port> the sign-in/picker host rather than a tenant.
  DEFAULT_SUBDOMAIN: ${AOS_CRM_DEFAULT_SUBDOMAIN:-app}

services:
  server:
    <<: *aos-crm-app
    environment:
      <<: *aos-crm-env
      NODE_PORT: "3000"
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    ports:
      - "127.0.0.1:${AOS_CRM_WEB_PORT:-43000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The entrypoint runs database:init:prod + upgrade + cron:register:all
      # before the server listens, which on a cold volume is minutes. Without
      # a start period, 20 x 5 s elapses first and the dependent worker is
      # refused with "dependency failed to start" on a stack that is merely
      # still migrating. Failures inside this window do not count.
      #
      # Sized from the worst start actually measured on this host, not from a
      # fast run: on 2026-10-28 the official entrypoint booted Nest FOUR times
      # (init/migrations, upgrade, flush, cron:register) at ~2 min each and the
      # server began listening 8.6 min (516 s) after container start, with
      # upgrade 1/1 ok and no restart. The window then was 300 s + 20 x 5 s
      # (~6.7 min), so `up` gave up at 6.7 min on a server that was healthy
      # 2 min later and left the dependent worker in Created.
      # 900 s is that 516 s with a 1.74x margin, which is deliberately more
      # than host jitter: the measured run had an already-migrated database,
      # and a cold volume runs every migration for the first time.
      # The failure detection is NOT widened with it -- interval/timeout/
      # retries are untouched, so once the server has answered /healthz once,
      # a server that dies is still unhealthy within 20 x 5 s.
      start_period: 900s

  worker:
    <<: *aos-crm-app
    environment:
      <<: *aos-crm-env
      # The server above already runs migrations and registers cron jobs;
      # the worker must not race it (packages/twenty-docker/docker-compose.yml
      # applies the same split).
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    command: ["yarn", "worker:prod"]
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

  db:
    # Immutable digest, not the moving `postgres:16` alias (CRM-004). Both
    # `postgres:16` and `postgres:16.15` resolved to this index digest on
    # 2026-10-27; the tag is kept beside it only so the version is readable.
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: ${AOS_CRM_PG_DB:-aos_crm_local}
      POSTGRES_USER: ${AOS_CRM_PG_USER:-aos_crm}
      POSTGRES_PASSWORD: ${AOS_CRM_PG_PASSWORD:?set AOS_CRM_PG_PASSWORD in deploy/local/.env}
    volumes:
      - aos-crm-local-db:/var/lib/postgresql/data
    networks:
      - aos-crm-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AOS_CRM_PG_USER:-aos_crm} -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No ports: published only on the aos-crm-local network (SEC-02).

  redis:
    # Immutable digest (CRM-004), same resolution as `redis:7` on 2026-10-27.
    # 7.4.x is RSALv2/SSPLv1, not BSD-3 like 7.2.x -- fine for this local
    # single-tenant stack, recorded in LICENSE_COMPLIANCE.md for CRM-006.
    image: redis:7.4.12@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
    # Append-only on a named volume: the queue is state, not cache. Without
    # this, removing the container (any `compose down`) drops every queued and
    # repeatable job, and the stack comes back looking fine because the server
    # re-registers the cron jobs on boot -- which is exactly the kind of silent
    # loss that is only visible if you look for the keys.
    command: ["--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - aos-crm-local-redis:/data
    networks:
      - aos-crm-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No ports: published only on the aos-crm-local network (SEC-02).

networks:
  aos-crm-local:
    name: aos-crm-local
    driver: bridge

volumes:
  aos-crm-local-db:
    name: aos-crm-local-db
  aos-crm-local-storage:
    name: aos-crm-local-storage
  aos-crm-local-redis:
    name: aos-crm-local-redis
